gui:
  showFileTree: true
  nerdFontsVersion: 3
  showRandomTip: false
  showCommandLog: true
  showBottomLine: true
  filterMode: fuzzy
  showDivergenceFromBaseBranch: arrowAndNumber
  sidePanelWidth: 0.28
  expandFocusedSidePanel: true
  # crank high so unfocused side panels collapse to ~1 line; lazygit cannot
  # reorder/hide panels (hardcoded, see jesseduffield/lazygit#3621)
  expandedSidePanelWeight: 20
  enlargedSideViewLocation: top
  scrollOffMargin: 5
  commitHashLength: 7
  theme:
    activeBorderColor: ["#ff9e64", "bold"]
    inactiveBorderColor: ["#27a1b9"]
    searchingActiveBorderColor: ["#ff9e64", "bold"]
    optionsTextColor: ["#7aa2f7"]
    selectedLineBgColor: ["#283457"]
    cherryPickedCommitFgColor: ["#7aa2f7"]
    cherryPickedCommitBgColor: ["#bb9af7"]
    markedBaseCommitFgColor: ["#7aa2f7"]
    markedBaseCommitBgColor: ["#e0af68"]
    unstagedChangesColor: ["#db4b4b"]
    defaultFgColor: ["#c0caf5"]
    inactiveViewSelectedLineBgColor: ["#1f2335"]
os:
  editPreset: "nvim"
git:
  log:
    # topo-order makes lazygit unusably slow on huge repos like nixpkgs
    # https://github.com/jesseduffield/lazygit/issues/5163
    order: default
  diffRenderers:
    - command: delta --paging=never --line-numbers --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"
  autoFetch: false
  autoStageResolvedConflicts: false
  parseEmoji: true
customCommands:
  # tuicr - review diffs like a PR
  - key: <c-t>
    command: tuicr -r "{{.SelectedCommit.Sha}}^..HEAD"
    context: commits
    description: tuicr review (selected commit..HEAD)
    output: terminal
  - key: <c-t>
    command: tuicr -r "{{.SelectedSubCommit.Sha}}^..{{.SelectedSubCommit.Sha}}"
    context: subCommits
    description: tuicr review selected commit
    output: terminal
  - key: <c-t>
    command: tuicr -w
    context: files
    description: tuicr review working tree
    output: terminal
  - key: <c-t>
    command: tuicr -r "{{.SelectedLocalBranch.UpstreamRemote}}/{{.SelectedLocalBranch.UpstreamBranch}}..{{.SelectedLocalBranch.Name}}"
    context: localBranches
    description: tuicr review branch vs upstream
    output: terminal
  # tig commands
  - key: b
    context: files
    description: Blame selected file with tig
    command: tig blame -- {{.SelectedFile.Name}}
    output: terminal
  - key: b
    context: commitFiles
    description: Blame file at selected revision with tig
    command: tig blame {{.SelectedCommit.Sha}} -- {{.SelectedCommitFile.Name}}
    output: terminal
