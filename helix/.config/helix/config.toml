theme = "kanagawa"

[editor]
auto-pairs = false
shell = ["nu", "-c"]
# line-number = "relative"
cursorline = true
bufferline = "always"
popup-border = "all"
end-of-line-diagnostics = "hint"
true-color = true
undercurl = true
# rainbow-brackets = true
trim-final-newlines = true
trim-trailing-whitespace = true

[editor.cursor-shape]
insert = "underline"

[editor.inline-diagnostics]
cursor-line = "error"

[editor.indent-guides]
render = true

[editor.soft-wrap]
enable = true
max-wrap = 30
