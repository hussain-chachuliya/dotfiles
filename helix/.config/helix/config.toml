theme = "kanagawa"

[editor]
auto-pairs = false
shell = ["nu", "-c"]
# line-number = "relative"
cursorline = true
bufferline = "always"
popup-border = "all"
end-of-line-diagnostics = "hint"
true-color = true
undercurl = true
# rainbow-brackets = true
trim-final-newlines = true
trim-trailing-whitespace = true

[editor.cursor-shape]
insert = "underline"

[editor.inline-diagnostics]
cursor-line = "error"

[editor.indent-guides]
render = true

[editor.soft-wrap]
enable = true
max-wrap = 30

[keys.normal]
# Yank directly to system clipboard
y = "yank_to_clipboard"
Y = "yank_joined_to_clipboard"

# Paste directly from system clipboard
p = "paste_clipboard_after"
P = "paste_clipboard_before"

# Delete/Cut directly to system clipboard
d = ["yank_to_clipboard", "delete_selection_noyank"]

# Replace selection with system clipboard content
R = "replace_selections_with_clipboard"

[keys.select]
# Mirror yank and delete in select mode
y = "yank_to_clipboard"
d = ["yank_to_clipboard", "delete_selection_noyank"]
