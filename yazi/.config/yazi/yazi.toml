#:schema https://yazi-rs.github.io/schemas/yazi.json

[mgr]
# Default view: size + mtime, newest first (same as `,M`).
linemode = "size_mtime"
sort_by = "mtime"
sort_reverse = true

[plugin]
# boydaihungst/mediainfo — stacked preview: thumbnail on top, mediainfo below.
# Preloaders are optional but make the thumbnail appear instantly.
prepend_preloaders = [{ mime = "{audio,video,image}/*", run = "mediainfo" }]
prepend_previewers = [
  { mime = "{audio,video,image}/*", run = "mediainfo" },
  { url = "*.md", run = 'piper -- bat --color=always --style=plain "$1"' },
]

[opener]
edit = [
  { run = "hx %s", desc = "helix", for = "unix", block = true },
]
play = [
  { run = "gio open %s1", desc = "Play", for = "linux" },
  { run = "open %s1", desc = "Play", for = "macos" },
  { run = "mediainfo %s1; echo 'Press enter to exit'; read _", block = true, desc = "Show media info", for = "unix" },
]
open = [
  { run = "gio open %s1", desc = "Open", for = "linux" },
  { run = "open %s1", desc = "Open", for = "macos" },
]
reveal = [
  { run = "nautilus --new-window %d1", desc = "Reveal", for = "linux", orphan = true },
  { run = "open -R %s1", desc = "Reveal", for = "macos", orphan = true },
  { run = "clear; exiftool %s1; echo 'Press enter to exit'; read _", desc = "Show EXIF", for = "unix", block = true },
]
extract = [{ run = "ya pub extract --list %s", desc = "Extract here" }]

[open]
rules = [
  { mime = "folder/*", use = [
    "edit",
    "open",
    "reveal",
  ] },
  { mime = "text/*", use = [
    "edit",
    "reveal",
  ] },
  { mime = "image/*", use = [
    "open",
    "reveal",
  ] },
  { mime = "{audio,video}/*", use = [
    "play",
    "reveal",
  ] },
  { mime = "application/{json,ndjson,javascript,wine-extension-ini}", use = [
    "edit",
    "reveal",
  ] },
  { mime = "application/{zip,rar,7z*,tar,gzip,xz,zstd,bzip*,lzma,compress,archive,cpio,arj,xar,ms-cab*}", use = [
    "extract",
    "reveal",
  ] },
  { mime = "inode/empty", use = [
    "edit",
    "reveal",
  ] },
  { mime = "vfs/{absent,stale}", use = "download" },
  { url = "*", use = [
    "open",
    "reveal",
  ] },
]
