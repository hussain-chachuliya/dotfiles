# Compress (compress.yazi)
[[mgr.prepend_keymap]]
on = ["c", "a", "a"]
run = "plugin compress"
desc = "Archive selected files"

[[mgr.prepend_keymap]]
on = ["c", "a", "z"]
run = "plugin compress zip"
desc = "Archive selected files (zip)"

[[mgr.prepend_keymap]]
on = ["c", "a", "t"]
run = "plugin compress tar"
desc = "Archive selected files (tar)"

[[mgr.prepend_keymap]]
on = ["c", "a", "g"]
run = "plugin compress tar.gz"
desc = "Archive selected files (tar.gz)"

[[mgr.prepend_keymap]]
on = ["c", "a", "x"]
run = "plugin compress tar.xz"
desc = "Archive selected files (tar.xz)"

[[mgr.prepend_keymap]]
on = ["c", "a", "p"]
run = "plugin compress -p"
desc = "Archive selected files (password)"

[[mgr.prepend_keymap]]
on = ["c", "a", "l"]
run = "plugin compress -l"
desc = "Archive selected files (compression level)"

# Thunar "extra" chord
[[mgr.prepend_keymap]]
on = ["e", "p"]
run = 'shell --block -- "$HOME/.config/yazi/scripts/properties.sh" %s'
desc = "Properties dialog"

[[mgr.prepend_keymap]]
on = ["e", "d"]
run = 'shell --block -- "$HOME/.config/yazi/scripts/duplicate.sh" %s'
desc = "Duplicate selected files"

[[mgr.prepend_keymap]]
on = ["e", "h"]
run = 'shell --block -- "$HOME/.config/yazi/scripts/hash.sh" %s'
desc = "Show checksums (sha256 + md5)"

[[mgr.prepend_keymap]]
on = ["e", "c"]
run = 'shell --block -- "$HOME/.config/yazi/scripts/clipboard.sh" %s'
desc = "Copy file contents to clipboard"

[[mgr.prepend_keymap]]
on = ["e", "m"]
run = "plugin mediainfo -- toggle-metadata"
desc = "Toggle mediainfo metadata in preview"

[[mgr.prepend_keymap]]
on = ["z"]
run = "plugin zoxide"
desc = "Jump to a directory using zoxide"

[[mgr.prepend_keymap]]
on = ["Z"]
run = "plugin fzf"
desc = "Jump to a file/directory via fzf"

[[mgr.prepend_keymap]]
on = "<Enter>"
run = "plugin smart-enter"
desc = "Enter the child directory, or open the file"

[[mgr.prepend_keymap]]
on = "M"
run = "plugin mount"
