# Scroll left/up to view previous tag
# axisbind=NONE,LEFT,viewtoleft
# axisbind=NONE,UP,viewtoleft

# Scroll right/down to view next tag
# axisbind=NONE,RIGHT,viewtoright
# axisbind=NONE,DOWN,viewtoright

# 3-Finger Swipes: Switch to previous and next tags
gesturebind=none,left,3,viewtoright
gesturebind=none,right,3,viewtoleft

# 3-Finger Up/Down: Toggle Overview mode
gesturebind=none,up,3,toggleoverview
gesturebind=none,down,3,toggleoverview
