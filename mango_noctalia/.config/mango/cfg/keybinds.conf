# =========================================================================
# WINDOW MANAGEMENT
# =========================================================================
bind=SUPER,q,killclient
bind=SUPER,f,togglefullscreen
bind=SUPER,m,togglemaximizescreen
bind=SUPER,minus,resizewin,-50,0
bind=SUPER,equal,resizewin,50,0

# --- Focus ---
bind=SUPER,Left,focusdir,left
bind=SUPER,Right,focusdir,right
bind=SUPER,Up,focusdir,up
bind=SUPER,Down,focusdir,down

# Switch between windows on all tags
bind=SUPER,Tab,switcher,all_next
bind=SUPER+SHIFT,Tab,switcher,all_prev
# Or, to restrict switching to the current tag only:
# bind=SUPER,Tab,switcher,next

# --- Move focus ---
bind=SUPER+SHIFT,Left,exchange_client,left
bind=SUPER+SHIFT,Right,exchange_client,right
bind=SUPER+SHIFT,Up,exchange_client,up
bind=SUPER+SHIFT,Down,exchange_client,down

# =========================================================================
# MONITORS
# =========================================================================
# Switch between monitors
bind = SUPER+ALT, Left, focusmon, left
bind = SUPER+ALT, Right, focusmon, right
# Move window to another monitor
bind = SUPER+CTRL, Left, tagmon, left
bind = SUPER+CTRL, Right, tagmon, right


# =========================================================================
# WORKSPACES
# =========================================================================
bind=SUPER,1,view,1,0
bind=SUPER,2,view,2,0
bind=SUPER,3,view,3,0
bind=SUPER,4,view,4,0
bind=SUPER,5,view,5,0
bind=SUPER,6,view,6,0
bind=SUPER,7,view,7,0
bind=SUPER,8,view,8,0
bind=SUPER,9,view,9,0

bind=SUPER+SHIFT,1,tag,1,0
bind=SUPER+SHIFT,2,tag,2,0
bind=SUPER+SHIFT,3,tag,3,0
bind=SUPER+SHIFT,4,tag,4,0
bind=SUPER+SHIFT,5,tag,5,0
bind=SUPER+SHIFT,6,tag,6,0
bind=SUPER+SHIFT,7,tag,7,0
bind=SUPER+SHIFT,8,tag,8,0
bind=SUPER+SHIFT,9,tag,9,0

bind = SUPER, s, toggle_scratchpad
# bind=SUPER,Page_Down,workspace,down
# bind=SUPER,Page_Up,workspace,up
# bind=SUPER,i,workspace,up
# bind=SUPER+CTRL,Page_Down,movetoworkspace,down
# bind=SUPER+CTRL,Page_Up,movetoworkspace,up
# bind=SUPER+SHIFT,Page_Down,workspace_down
# bind=SUPER+SHIFT,Page_Up,workspace_up
# bind=SUPER+SHIFT,i,workspace_up


# =========================================================================
# OVERVIEW & LAUNCHERS
# =========================================================================
bind=ALT,Tab,toggleoverview
bind=SUPER,space,spawn,~/.config/mango/scripts/noctalia-msg.sh panel-toggle launcher
bind=SUPER+SHIFT,Comma,spawn,~/.config/mango/scripts/noctalia-msg.sh panel-toggle launcher /emo

bind=SUPER,Return,spawn,kitty
bind=SUPER,e,spawn,kitty yazi
bind=SUPER,b,spawn,helium-browser
bind=SUPER,o,spawn,obsidian
bind=SUPER,t,spawn,kitty nvim
bind=SUPER,l,spawn,localsend
bind=CTRL+ALT,Delete,spawn,kitty btop

# =========================================================================
# PANELS & SYSTEM
# =========================================================================
bind = SUPER, n, switch_layout
bind=SUPER,z,spawn,~/.config/mango/scripts/noctalia-msg.sh settings-toggle
bind=SUPER+SHIFT,z,spawn,~/.config/mango/scripts/noctalia-msg.sh panel-toggle control-center
bind=SUPER+SHIFT,l,spawn,~/.config/mango/scripts/noctalia-msg.sh session lock
bind=SUPER+SHIFT,e,quit

bind=SUPER,F11,spawn,~/.config/mango/scripts/noctalia-msg.sh dpms-on
bind=SUPER,F12,spawn,~/.config/mango/scripts/noctalia-msg.sh dpms-off
bind=SUPER+SHIFT,F11,spawn_shell,swaymsg output \* power on
bind=SUPER+SHIFT,F12,spawn_shell,swaymsg output \* power off

# =========================================================================
# BAR / DOCK / TOGGLES
# =========================================================================
bind=SUPER+CTRL,b,spawn,~/.config/mango/scripts/noctalia-msg.sh bar-toggle
bind=SUPER+ALT,b,spawn,~/.config/mango/scripts/noctalia-msg.sh bar-auto-hide-set toggle
bind=SUPER+SHIFT,d,spawn,~/.config/mango/scripts/noctalia-msg.sh dock-reload
bind=SUPER+CTRL,d,spawn,~/.config/mango/scripts/noctalia-msg.sh dock-toggle
bind=SUPER+ALT,d,spawn,~/.config/mango/scripts/noctalia-msg.sh dock-auto-hide-set toggle

bind=SUPER+CTRL,g,spawn,~/.config/mango/scripts/noctalia-msg.sh caffeine-toggle
bind=SUPER+CTRL,u,spawn,~/.config/mango/scripts/noctalia-msg.sh nightlight-toggle
bind=SUPER+CTRL,o,spawn,~/.config/mango/scripts/noctalia-msg.sh osd-toggle
bind=SUPER+SHIFT,b,spawn,~/.config/mango/scripts/noctalia-msg.sh bluetooth-toggle
bind=SUPER+SHIFT,p,spawn,~/.config/mango/scripts/noctalia-msg.sh panel-toggle session
bind=SUPER+SHIFT,f,spawn,~/.config/mango/scripts/noctalia-msg.sh wifi-toggle
bind=SUPER+CTRL,x,spawn,~/.config/mango/scripts/noctalia-msg.sh network-toggle
bind=SUPER,a,spawn,~/.config/mango/scripts/noctalia-msg.sh panel-toggle control-center notifications
bind=SUPER+CTRL,n,spawn,~/.config/mango/scripts/noctalia-msg.sh notification-dnd-toggle
bind=SUPER+SHIFT,n,spawn,~/.config/mango/scripts/noctalia-msg.sh notification-clear-active

# =========================================================================
# AUDIO & BRIGHTNESS
# =========================================================================
# Media controls
bind = NONE, XF86AudioRaiseVolume, spawn, noctalia msg volume-up
bind = NONE, XF86AudioLowerVolume, spawn, noctalia msg volume-down
bind = NONE, XF86AudioMute, spawn, noctalia msg volume-mute
bind = NONE, XF86AudioMicMute, spawn, noctalia msg mic-mute
bind = NONE, XF86AudioNext, spawn, noctalia msg media next
bind = NONE, XF86AudioPrev, spawn, noctalia msg media previous
bind = NONE, XF86AudioPlay, spawn, noctalia msg media toggle

# Brightness controls
bind = NONE, XF86MonBrightnessUp, spawn, noctalia msg brightness-up
bind = NONE, XF86MonBrightnessDown, spawn, noctalia msg brightness-down

# =========================================================================
# SCREENSHOTS & UTILITIES
# =========================================================================
bind=NONE,Print,spawn,~/.config/mango/scripts/noctalia-msg.sh screenshot-region
bind=SUPER,Print,spawn,~/.config/mango/scripts/noctalia-msg.sh screenshot-fullscreen
bind=ALT,Print,spawn,~/.config/mango/scripts/noctalia-msg.sh screenshot-annotate

bind=CTRL+SHIFT,1,spawn_shell,grim -g "$(slurp)" ~/Pictures/screenshot-$(date +%s).png
bind=CTRL+SHIFT,2,spawn_shell,grim ~/Pictures/screenshot-$(date +%s).png
bind=CTRL+SHIFT,3,spawn_shell,grim -g "$(slurp)" ~/Pictures/screenshot-$(date +%s).png

bind=SUPER,p,spawn,~/.config/mango/scripts/pick-color.sh
bind=SUPER+SHIFT,w,spawn,~/.config/mango/scripts/noctalia-msg.sh panel-toggle wallpaper
bind=SUPER+CTRL,w,spawn,~/.config/mango/scripts/noctalia-msg.sh wallpaper-random
bind=SUPER+SHIFT,m,spawn,~/.config/mango/scripts/noctalia-msg.sh theme-mode-toggle

# =========================================================================
# CLIPBOARD & TRANSLITERATION
# =========================================================================
bind=SUPER,v,spawn,~/.config/mango/scripts/noctalia-msg.sh panel-toggle clipboard
bind=SUPER,u,spawn,~/.local/bin/urdu-translit --clip
bind=SUPER+SHIFT,u,spawn,~/.local/bin/urdu-translit --clip --word --pick 2



# =========================================================================
# MOUSE BUTTON BINDINGS
# =========================================================================
# btn_left and btn_right can't bind none mod key
mousebind = SUPER, btn_left, moveresize,curmove
mousebind = NONE, btn_middle, togglemaximizescreen, 0
mousebind = SUPER, btn_right, moveresize, curresize
