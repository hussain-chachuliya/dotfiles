# Modular layout mirrors the Mango config: each cfg/*.toml file owns one area.
# Check edits with: umbriel config validate

[include]
files = [
  "cfg/general.toml",
  "cfg/autostart.toml",
  "cfg/env.toml",
  "cfg/monitors.toml",
  "cfg/input.toml",
  "cfg/appearance.toml",
  "cfg/animation.toml",
  "cfg/layout.toml",
  "cfg/rules.toml",
  "cfg/layer_rules.toml",
  "cfg/keybinds.toml",
]

# Palette generated by Noctalia's Umbriel template.
[include.optional]
files = ["noctalia.toml"]
